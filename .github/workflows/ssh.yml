name: SSH Tunnel & Web Server Setup

on:
  workflow_dispatch:

jobs:
  setup-ssh-tunnel:
    runs-on: ubuntu-latest
    environment: Cricket
    steps:
      - name: Install necessary dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git openssh-server curl

      - name: Create SSH directory for runner user
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

      - name: Set up SSH keys for runner user
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Install Flussonic
        run: |
          sudo mkdir -p /opt/Flussonic
          sudo git clone "https://github.com/Bighra13/flussonic.git" /opt/Flussonic
          cd /opt/Flussonic
          sudo bash Flussonic_23.01_Nulled.sh

      - name: Start SSH tunnel for port 80 access
        run: |
          nohup ssh -N -L 0.0.0.0:80:localhost:80 -p 22 -i ~/.ssh/id_rsa user@your-remote-server-ip &
          echo "SSH Tunnel started on port 80"

      - name: Display public IP
        run: |
          PUBLIC_IP=$(curl -s ifconfig.me)
          echo "Public IP of the machine: $PUBLIC_IP"

      - name: Keep the workflow running
        run: |
          tail -f /dev/null
